name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz
          sudo mv mcp-publisher /usr/local/bin/mcp-publisher

      - name: Update server.json version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Wait for npm registry propagation
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="@privadovpn/x402-mcp"
          for i in $(seq 1 24); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://registry.npmjs.org/${PKG}/${VERSION}")
            if [ "$status" = "200" ]; then
              echo "npm registry has ${PKG}@${VERSION}"
              exit 0
            fi
            echo "Attempt $i: npm registry not ready yet (HTTP $status), waiting 10s..."
            sleep 10
          done
          echo "::error::npm registry did not return ${PKG}@${VERSION} after 4 minutes"
          exit 1

      - name: Publish to MCP registry
        id: mcp_publish
        continue-on-error: true
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: true

      - name: Fail job if MCP registry publish failed
        if: steps.mcp_publish.outcome == 'failure'
        run: |
          echo "::error::Publish to npm and the GitHub Release both succeeded, but the MCP registry publish failed. Rerun 'mcp-publisher publish' manually once resolved — do not re-run this whole job (npm publish is not re-runnable for this version)."
          exit 1
